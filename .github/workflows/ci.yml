
name: Leafline CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-quality-check:
    name: Test and Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run automated tests
        run: npm test

      - name: Check JavaScript quality
        run: npm run lint
